version: '3.8'

services:
  cf-tool:
    build:
      context: .
      dockerfile: Dockerfile.cf-tool
    container_name: cf-tool-env
    volumes:
      # Mount current directory to /workspace in container
      - .:/workspace
    # Note: ports mapping is not needed with host network mode
    # The container will directly use the host's network
    extra_hosts:
      # Allow container to reach host services via host.docker.internal
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    network_mode: host
